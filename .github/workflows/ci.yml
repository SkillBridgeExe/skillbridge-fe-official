name: CI

# Runs the same checks we run locally, on every PR into main and every push to main.
# This is the deterministic safety net (CodeRabbit handles the AI review layer).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # W118 deploy guard: the bundle must carry a working PDF worker wiring
      # (asset emitted, referenced by a chunk, current cache key) before it can
      # reach main / the auto-deploy. Catches the recurring blank-preview class.
      - name: Verify build (PDF worker guard)
        run: npm run verify:build
